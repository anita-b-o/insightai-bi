<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InsightAI BI</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Inter", "Segoe UI", sans-serif;
        background: #f4f7fa;
        color: #0f1d2d;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f4f7fa;
        color: #0f1d2d;
      }

      .boot-shell {
        min-height: 100dvh;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        background: #f4f7fa;
      }

      .boot-panel {
        width: min(720px, calc(100vw - 32px));
        margin: auto;
        border: 1px solid rgba(159, 180, 203, 0.34);
        border-radius: 16px;
        background: #ffffff;
        padding: 24px;
        box-shadow: 0 10px 28px rgba(12, 24, 40, 0.05);
      }

      .boot-kicker {
        margin: 0 0 12px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #3d536c;
      }

      .boot-title {
        margin: 0 0 10px;
        font-size: clamp(32px, 4vw, 56px);
        line-height: 1.04;
      }

      .boot-copy {
        margin: 0;
        max-width: 42rem;
        font-size: 18px;
        line-height: 1.55;
        color: #3d536c;
      }

      .boot-bar {
        height: 10px;
        border-radius: 999px;
        margin-top: 20px;
        background: linear-gradient(90deg, rgba(21, 94, 239, 0.16), rgba(11, 143, 178, 0.08));
        overflow: hidden;
      }

      .boot-bar::after {
        content: "";
        display: block;
        width: 36%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #155eef, #0b8fb2);
        animation: boot-slide 1.35s ease-in-out infinite alternate;
      }

      @keyframes boot-slide {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(175%);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-shell">
        <div class="boot-panel">
          <p class="boot-kicker">InsightAI BI</p>
          <h1 class="boot-title">Loading analytics workspace</h1>
          <p class="boot-copy">Preparing datasets, dashboards, and the current session context.</p>
          <div class="boot-bar" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
  </html>

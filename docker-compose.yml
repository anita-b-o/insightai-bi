services:
  db:
    image: postgres:16-alpine
    container_name: insightai-bi-db
    environment:
      POSTGRES_USER: insightai
      POSTGRES_PASSWORD: insightai
      POSTGRES_DB: insightai_bi
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insightai -d insightai_bi"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "false"
    container_name: insightai-bi-backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - app_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    command: ["/bin/sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/health').status == 200"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: insightai-bi-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    ports:
      - "5173:4173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:4173 >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  dashboard-refresh-worker:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "false"
    container_name: insightai-bi-dashboard-refresh-worker
    env_file:
      - ./backend/.env
    volumes:
      - app_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: ["/bin/sh", "-c", "alembic upgrade head && while true; do python -m app.workers.dashboard_refresh_worker; sleep 60; done"]
    restart: unless-stopped

volumes:
  postgres_data:
  app_storage:

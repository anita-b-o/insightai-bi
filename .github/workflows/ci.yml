name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --run

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: insightai
          POSTGRES_PASSWORD: insightai
          POSTGRES_DB: insightai_bi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U insightai -d insightai_bi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-secret-key
      APP_ENV: development
      POSTGRES_SERVER: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_USER: insightai
      POSTGRES_PASSWORD: insightai
      POSTGRES_DB: insightai_bi
      OPENAI_API_KEY: ""
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall app
      - run: python -c "import app.main; import app.workers.dashboard_refresh_worker; print('backend import smoke ok')"
      - run: alembic upgrade head

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build

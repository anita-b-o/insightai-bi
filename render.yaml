services:
  - type: web
    name: insightai-bi-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # CSV files are transient ingestion artifacts; PostgreSQL retains datasets.
    plan: free
    healthCheckPath: /health
    preDeployCommand: alembic upgrade head
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}
    envVars:
      - key: APP_ENV
        value: production
      - key: API_V1_PREFIX
        value: /api
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_DIRECT_URL
        sync: false
      - key: MAX_UPLOAD_BYTES
        value: "10485760"
      - key: MAX_DATASET_ROWS
        value: "50000"
      - key: MAX_DATASET_COLUMNS
        value: "100"
      - key: MAX_CELL_LENGTH
        value: "16384"
      - key: FEATURE_SELECTION_SAMPLE_ROWS
        value: "10000"
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_TIMEOUT_SECONDS
        value: "45"
      - key: OPENAI_MAX_RETRIES
        value: "1"
      - key: DASHBOARD_REFRESH_LOCK_TIMEOUT_SECONDS
        value: "300"
      - key: SCHEDULER_SECRET
        sync: false
      - key: SCHEDULER_REQUEST_MAX_AGE_SECONDS
        value: "300"
      - key: SCHEDULER_EXPECTED_INTERVAL_SECONDS
        value: "600"
      - key: SCHEDULER_HEARTBEAT_GRACE_SECONDS
        value: "300"
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0"

databases:
  # Keep the Render database during the rollback window. Remove it only after
  # the Neon cutover has been validated and a final Render backup is retained.
  - name: insightai-bi-postgres
    databaseName: insightai_bi
    user: insightai_bi
    plan: free
    diskSizeGB: 1
